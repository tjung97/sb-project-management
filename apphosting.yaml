runConfig:
  runtime: nodejs22

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAgUVHegxObHp_yxm1jeJx-z471XEK1nq8
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: seoul-bowl-orders.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: seoul-bowl-orders
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: seoul-bowl-orders.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1094423785414"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:1094423785414:web:0dee2450ec3dba7ef70cc7
    availability:
      - BUILD
      - RUNTIME

  - variable: EMAIL_FROM
    value: "Seoul Bowl Ops <ops@seoulbowl.com>"
    availability:
      - RUNTIME

  # FIREBASE_SERVICE_ACCOUNT_KEY is intentionally omitted here.
  # Firebase App Hosting provides Application Default Credentials automatically,
  # which the admin SDK uses via the applicationDefault() fallback in src/lib/firebase/admin.ts.

  # --- Sling / Toast / no-show: non-secret runtime values ---
  - variable: SLING_SOURCES
    value: "conversation:10157324,conversation:10157243,conversation:16626009,conversation:10157222"
    availability:
      - RUNTIME
  - variable: STORE_TIMEZONE
    value: America/Los_Angeles
    availability:
      - RUNTIME
  - variable: TOAST_API_BASE_URL
    value: https://ws-api.toasttab.com
    availability:
      - RUNTIME
  - variable: TOAST_BUSINESS_TIME_ZONE
    value: America/Los_Angeles
    availability:
      - RUNTIME

  # --- Secrets: set each value with (they prompt for the value + offer to grant
  #     backend access — say yes):
  #   npx firebase-tools apphosting:secrets:set SLING_TOKEN --project seoul-bowl-orders
  #   npx firebase-tools apphosting:secrets:set TOAST_CLIENT_ID --project seoul-bowl-orders
  #   npx firebase-tools apphosting:secrets:set TOAST_CLIENT_SECRET --project seoul-bowl-orders
  #   npx firebase-tools apphosting:secrets:set SLACK_WEBHOOK_URL --project seoul-bowl-orders
  #   npx firebase-tools apphosting:secrets:set CRON_SECRET --project seoul-bowl-orders
  # These references are already wired — just create the secrets, then redeploy.
  - variable: SLING_TOKEN
    secret: SLING_TOKEN
    availability:
      - RUNTIME
  - variable: TOAST_CLIENT_ID
    secret: TOAST_CLIENT_ID
    availability:
      - RUNTIME
  - variable: TOAST_CLIENT_SECRET
    secret: TOAST_CLIENT_SECRET
    availability:
      - RUNTIME
  - variable: SLACK_WEBHOOK_URL
    secret: SLACK_WEBHOOK_URL
    availability:
      - RUNTIME
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
